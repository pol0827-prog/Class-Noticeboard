// 큰 파일 나눠 저장: 데이터베이스 칸 하나는 1MB까지라 900KB 조각으로 나눠 "경로", "경로_1", "경로_2"… 에 넣고, 열 때 다시 붙임
const CH=900000,FMAX=10*1024*1024;
async function putBig(base,data,extra,prog){const P=[];for(let i=0;i<data.length;i+=CH)P.push(data.slice(i,i+CH));for(let i=P.length-1;i>=0;i--){if(prog&&P.length>1)prog(P.length-i,P.length);await FB.set(base+(i?'_'+i:''),{...extra,data:P[i],nk:P.length})}return P.length}
async function getBig(base){const d=await FB.get(base);if(!d||!d.data)throw new Error('nodata');const n=d.nk||1;if(n<2)return d.data;const r=await Promise.all([...Array(n-1)].map((_,i)=>FB.get(base+'_'+(i+1))));return d.data+r.map(x=>x.data).join('')}
const delBig=(base,n)=>[...Array(Math.max(1,n||1))].map((_,i)=>['del',base+(i?'_'+i:'')]);
// 10MB 넘는 PDF: 몇 개로 나눌지, 쪽 범위와 나누는 방법을 알려 줌
async function pdfAdvice(f){const mb=f.size/1048576,k=Math.max(2,Math.ceil(f.size/(FMAX*0.95)));let pg=0;
 G('modal').innerHTML='<div class=modal><div class=card style="text-align:center">📄 PDF를 살펴보는 중이에요…</div></div>';
 try{const L=await lib('p');L.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pg=(await L.getDocument({data:await f.arrayBuffer()}).promise).numPages}catch(e){}
 const per=pg?Math.ceil(pg/k):0,parts=pg?[...Array(k)].map((_,i)=>[i*per+1,Math.min(pg,(i+1)*per)]).filter(([a,b])=>a<=b):[];
 G('modal').innerHTML=`<div class=modal onclick="G('modal').innerHTML=''"><div class=card onclick="event.stopPropagation()"><h3>📄 PDF가 너무 커요</h3><p>이 파일은 약 <b>${mb.toFixed(1)}MB</b>예요. 한 번에 <b>10MB</b>까지 올릴 수 있으니 <b>${parts.length||k}개로 나눠서</b> 하나씩 올려 주세요.</p>${parts.length?`<p>전체 ${pg}쪽 → 이렇게 나누면 돼요:</p><p>${parts.map(([a,b],i)=>`<span class=un style="background:#a8672f">${i+1}번 파일: ${a}~${b}쪽</span>`).join(' ')}</p>`:''}<small>그림이 많은 쪽이 몰려 있으면 한 파일이 여전히 10MB를 넘을 수 있어요. 그때는 그 부분을 한 번 더 나눠 주세요.</small>
 <h4 style="margin-top:10px">✂️ 나누는 방법</h4><ol style="padding-left:20px;margin:4px 0"><li>PDF를 크롬(또는 엣지)으로 열어요.</li><li>인쇄를 눌러요 (컴퓨터: Ctrl+P / 휴대폰: ⋮ → 공유 → 인쇄).</li><li>프린터(대상)를 <b>"PDF로 저장"</b>으로 골라요.</li><li><b>페이지</b>를 "맞춤 설정"으로 바꾸고 위의 쪽 범위(예: ${parts.length?parts[0][0]+'-'+parts[0][1]:'1-10'})를 넣어 저장해요.</li><li>나머지 범위도 똑같이 저장한 뒤, 이름 뒤에 (1), (2)…를 붙여 하나씩 올려요.</li></ol>
 <p class=note>나누기 어렵다면 구글 드라이브에 올리고 "링크가 있는 사용자 보기"로 공유한 뒤 링크로 올려도 돼요.</p><button class="btn blk" onclick="G('modal').innerHTML=''">알겠어요</button></div></div>`}
const isPdf=f=>f.type=='application/pdf'||/\.pdf$/i.test(f.name);
const fr=(f,priv)=>{const row=`<div class=row><span>${f.t=='link'?'🔗':'📄'} ${esc(f.n)}${T()&&priv?` <small style="display:inline">→ ${esc(f.s)}</small>`:''}<small>${md(f.ts)}</small></span><span><button class="btn ghost sm" onclick="openF('${f.id}','${priv?esc(f.s):''}')">⬇️ 열기</button>${T()?` <button class="btn ghost sm" onclick="delF('${f.id}','${priv?esc(f.s):''}')">삭제</button>`:''}</span></div>`;return S.admin?row:rc('F'+f.id,esc(f.n),row)};
const findF=(id,s)=>(s?(S.admin?S.pfAll:S.pf):S.files).find(f=>f.id==id);
async function openF(id,s){const f=findF(id,s);if(!f)return;mk('F'+id);if(f.u){window.open(f.u,'_blank','noopener');return}
 const w=window.open('','_blank');try{toast('여는 중이에요…');const data=await getBig(s?`pf/${s}/d/${id}`:`fdata/${id}`);const u=URL.createObjectURL(await (await fetch(data)).blob());if(w)w.location=u;else location.href=u}catch(e){if(w)w.close();toast('파일을 열지 못했어요')}}
function delF(id,s){const f=findF(id,s),nk=f&&f.u?0:(f&&f.nk)||1;FB.batch(s?[['del',`pf/${s}/f/${id}`],...(nk?delBig(`pf/${s}/d/${id}`,nk):[])]:[['del','files/'+id],...(nk?delBig('fdata/'+id,nk):[])]).then(()=>toast('삭제했어요'),fail('삭제하지 못했어요'))}
async function up(inp,k){const x=inp.files[0];if(!x)return;const isImg=/^image\/(jpeg|png|webp|gif|heic|heif)/.test(x.type);if(!isImg&&x.size>FMAX){inp.value='';return isPdf(x)?pdfAdvice(x):toast('사진이 아닌 파일은 10MB 이하만 올릴 수 있어요. 더 큰 파일은 링크로 등록해 주세요')}
 const base=x.name.replace(/\.[^.]+$/,''),n=(G(UPID[k][0]).value.trim())||base,to=k=='p'?G('ps').value:'',id=FB.id();if(k=='p'&&!to){inp.value='';return toast('받을 학생을 먼저 골라 주세요')}
 try{toast('올리는 중이에요…');const data=isImg?await fitImg(x):await readURL(x),meta={n,c:CK,t:isImg?'image/jpeg':(x.type||'file'),nm:x.name,u:'',ts:Date.now()};
  const prog=(i,n)=>toast(`올리는 중이에요 (${i}/${n})`);
  if(to){meta.nk=await putBig(`pf/${to}/d/${id}`,data,{c:CK},prog);await FB.set(`pf/${to}/f/${id}`,{...meta,s:to})}else{meta.nk=await putBig('fdata/'+id,data,{c:CK},prog);await FB.set('files/'+id,{...meta,k})}
  inp.value='';clr(UPID[k][0]);toast(to?`${to} 학생에게만 올렸어요`:k=='m'?'전체 학생에게 올렸어요':'올렸어요')}catch(e){inp.value='';fail('올리지 못했어요')(e)}}
function addLk(k){const n=G(UPID[k][0]).value.trim(),u=safeU(G(UPID[k][1]).value),to=k=='p'?G('ps').value:'',id=FB.id();if(k=='p'&&!to)return toast('받을 학생을 먼저 골라 주세요');if(!n||!u)return toast('제목과 올바른 링크 주소를 모두 넣어 주세요');
 const meta={n,c:CK,u,t:'link',nm:n,ts:Date.now()};(to?FB.set(`pf/${to}/f/${id}`,{...meta,s:to}):FB.set('files/'+id,{...meta,k})).then(()=>{clr(...UPID[k]);toast(to?`${to} 학생에게만 링크를 등록했어요`:'링크를 등록했어요')},fail('등록하지 못했어요'))}
// 올리기 칸: m = 전체 학생에게, p = 한 학생에게만, l = 자료실
const UPID={m:['mt','mu'],p:['pt','pu'],l:['lt','lu']};
const upCard=(k,title,note)=>`<div class=card><h4>${title}</h4>${k=='p'?`<small>받을 학생 (꼭 골라 주세요)</small><select id=ps>${rOpts('','학생 선택')}</select>`:''}<input id=${UPID[k][0]} placeholder="자료 제목 (예: ${k=='p'?'10월 모의고사 성적표':'2학기 수행평가 안내'})"><small>① 링크로 올리기</small><div class=send><input id=${UPID[k][1]} type=url placeholder="링크 주소 https://"><button class="btn sm" onclick="addLk('${k}')">링크 등록</button></div><small>② 사진·PDF 바로 올리기 (사진은 크기 상관없이 앱이 줄여서 올리고, PDF는 10MB 이하)</small><input type=file accept="image/*,application/pdf,.pdf" onchange="up(this,'${k}')"><p class=ai>${note}</p></div>`;
V.mine=()=>{const t=T(),pub=files().filter(f=>f.k=='m'),priv=pfs(),who=HR()?'학생과 그 학부모':'학생';
 if(t){const by={};priv.forEach(f=>(by[f.s]=by[f.s]||[]).push(f));const R=roster(),lb=s=>(R.find(r=>r.s==s)||{}).lbl||'';
  return upCard('m','📢 전체 학생에게 올리기','이 반 학생 모두'+(HR()?'와 학부모':'')+'가 볼 수 있어요.')+upCard('p','🔒 한 학생에게만 올리기',`고른 ${who}만 볼 수 있어요. 개인 성적표·시간표 같은 자료에 써요.`)
  +`<div class=card><h4>📢 전체 학생에게 올린 자료 <small style="display:inline">${pub.length}개</small></h4>${pub.map(f=>fr(f,0)).join('')||'<p class=note>아직 없어요</p>'}</div>`
  +`<div class=card><h4>🔒 한 학생에게만 올린 자료 <small style="display:inline">${priv.length}개</small></h4>${Object.keys(by).sort().map(s=>`<h4 style="margin-top:10px">🎒 ${esc(s)} ${esc(lb(s))}</h4>`+by[s].map(f=>fr(f,1)).join('')).join('')||'<p class=note>아직 없어요</p>'}</div>`}
 return `<div class=card><h4>📢 선생님이 모두에게 올린 자료</h4>${pub.map(f=>fr(f,0)).join('')||'<p class=note>아직 올라온 자료가 없어요</p>'}</div><div class=card><h4>🔒 ${P()?'자녀에게만 온 자료':'나에게만 온 자료'}</h4>${priv.map(f=>fr(f,1)).join('')||'<p class=note>아직 없어요</p>'}<p class=ai>🔒 ${P()?'자녀와 보호자만':HR()?'나와 우리 보호자만':'나만'} 볼 수 있어요</p></div>`};
// 자료실: 전체 자료(k=m·l)와 한 학생에게만 온 자료(pf)를 한곳에
V.lib=()=>{const t=T(),ln=[['🧾','나이스 바로가기','https://www.neis.go.kr'],...(S.cfg.apps||[]).map(a=>['📱',a.n,a.u])],pub=files(),priv=pfs(),who=HR()?'학생과 그 학부모':'학생';
 const links=`<div class=grid2>${ln.map(l=>`<a class="btn ghost lk" href="${esc(safeU(l[2]))}" target=_blank rel=noopener><i>${l[0]}</i>${esc(l[1])}</a>`).join('')}</div>`;
 if(t){const by={};priv.forEach(f=>(by[f.s]=by[f.s]||[]).push(f));const R=roster(),lb=s=>(R.find(r=>r.s==s)||{}).lbl||'';
  return upCard('m','📢 전체 학생에게 올리기','양식·안내문처럼 이 반 학생 모두'+(HR()?'와 학부모':'')+'가 볼 자료예요. 큰 파일은 드라이브 링크로 등록하세요.')+upCard('p','🔒 한 학생에게만 올리기',`고른 ${who}만 볼 수 있어요. 개인 성적표·시간표 같은 자료에 써요.`)
  +`<div class=card><h4>📢 전체 학생에게 올린 자료 <small style="display:inline">${pub.length}개</small></h4>${pub.map(f=>fr(f,0)).join('')||'<p class=note>아직 없어요</p>'}</div>`
  +`<div class=card><h4>🔒 한 학생에게만 올린 자료 <small style="display:inline">${priv.length}개</small></h4>${Object.keys(by).sort().map(s=>`<h4 style="margin-top:10px">🎒 ${esc(s)} ${esc(lb(s))}</h4>`+by[s].map(f=>fr(f,1)).join('')).join('')||'<p class=note>아직 없어요</p>'}</div>`
  +links+`<div class=card><h4>📱 학교 앱 바로가기 편집</h4>${(S.cfg.apps||[]).map((a,i)=>`<div class=row><span>${esc(a.n)}</span><button class="btn ghost sm" onclick="delApp(${i})">삭제</button></div>`).join('')}<input id=an placeholder="앱 이름"><input id=au type=url placeholder="웹 주소 https://"><button class="btn sm" onclick="addApp()">추가</button></div>`+subT()}
 return `<div class=card><h4>📢 선생님이 모두에게 올린 자료</h4>${pub.map(f=>fr(f,0)).join('')||'<p class=note>아직 올라온 자료가 없어요</p>'}</div><div class=card><h4>🔒 ${P()?'자녀에게만 온 자료':'나에게만 온 자료'}</h4>${priv.map(f=>fr(f,1)).join('')||'<p class=note>아직 없어요</p>'}<p class=ai>🔒 ${P()?'자녀와 보호자만':HR()?'나와 우리 보호자만':'나만'} 볼 수 있어요</p></div>`+links+(PV()||P()?'':subS())};
function addApp(){const n=G('an').value.trim(),u=safeU(G('au').value);if(!n||!u)return toast('이름과 주소를 모두 넣어 주세요');FB.set('config/main',{apps:[...(S.cfg.apps||[]),{n,u}]},true).then(()=>{clr('an','au');toast('추가했어요')},fail('저장하지 못했어요'))}

// ───────── 과제 제출(학생 → 선생님) ─────────
// 사진: 휴대폰 사진 그대로(원본 80MB까지) 고르면 앱이 알아서 → 긴 쪽 2000픽셀 이하 JPG로 줄여 900KB 이하로 저장(파이어스토어 문서 한도 1MB)
const SUB_MAXIN=80*1024*1024,SUB_PX=2000,SUB_MAX=900000;
const subs=()=>S.subs.filter(inK);
const SUBRULE=`사진: 휴대폰으로 찍은 사진을 그대로 고르면 돼요. 직접 줄이거나 압축할 필요 없이 앱이 긴 쪽 ${SUB_PX}픽셀 이하, 약 0.9MB 이하 JPG로 알아서 줄여서 올려요. PDF: 10MB 이하면 그대로 올라가요(더 크면 몇 개로 나눌지 알려 줘요). 링크: https:// 로 시작하는 주소(구글 드라이브 등은 "링크가 있는 사용자 보기"로 공유).`;
async function fitImg(f){for(const [px,q] of [[SUB_PX,.85],[SUB_PX,.75],[1700,.72],[1400,.7],[1200,.65],[1000,.6],[800,.5],[640,.45]]){const d=await shrink(f,px,q);if(d.length<=SUB_MAX)return d}throw new Error('too big')}
const subRow=(x,t)=>`<div class=row><span style="display:flex;gap:8px;align-items:center;min-width:0">${x.th?`<img src="${safeImg(x.th)}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openSub('${x.id}')">`:`<span style="font-size:26px">${x.pdf?'📄':'🔗'}</span>`}<span style="min-width:0">${t?`<b>${esc(x.s)} ${esc(x.n)}</b> · `:''}${esc(x.t||'과제')}<small>${md(x.ts)}${x.link?` · <a href="${esc(safeU(x.link))}" target=_blank rel=noopener>링크 열기</a>`:''}</small></span></span><span>${x.th||x.pdf?`<button class="btn ghost sm" onclick="openSub('${x.id}')">보기</button> `:''}<button class="btn ghost sm" onclick="delSub('${x.id}')">${t?'삭제':'제출 취소'}</button></span></div>`;
const subS=()=>{const L=subs();return `<div class=card><h4>📤 과제 제출 <small style="display:inline">(선생님만 볼 수 있어요)</small></h4><input id=sbt placeholder="과제 이름 (예: 시 감상문 1차)"><input id=sbl type=url placeholder="링크 주소 https:// (사진·PDF 대신 링크로 낼 때)"><small>사진이나 PDF로 낼 때는 아래에서 고르세요</small><input type=file id=sbf accept="image/*,application/pdf,.pdf"><button class="btn blk" onclick="subUp(this)">제출하기</button><p class=ai>📏 ${SUBRULE}</p></div><div class=card><h4>📁 내가 낸 과제 (${L.length})</h4>${L.map(x=>subRow(x,0)).join('')||'<p class=note>아직 낸 과제가 없어요</p>'}</div>`};
const subT=()=>{const L=subs();return `<div class=card><h4>📥 학생 과제 제출함 <small style="display:inline">${esc(cName(CK))} · ${L.length}건</small></h4>${L.map(x=>subRow(x,1)).join('')||'<p class=note>아직 제출된 과제가 없어요</p>'}<p class=ai>📏 학생 안내 기준 — ${SUBRULE}</p></div>`};
async function subUp(b){if(pv())return;const t=G('sbt').value.trim(),link=G('sbl').value.trim()?safeU(G('sbl').value):'',f=G('sbf').files[0],pr=S.prof;
 if(!t)return toast('과제 이름을 적어 주세요');if(!f&&!link)return toast('사진·PDF를 고르거나 링크를 넣어 주세요');if(G('sbl').value.trim()&&!link)return toast('링크 주소가 올바르지 않아요');
 if(f){if(isPdf(f)){if(f.size>FMAX){G('sbf').value='';return pdfAdvice(f)}}else if(f.type&&!/^image\//.test(f.type))return toast('사진이나 PDF 파일만 낼 수 있어요');else if(f.size>SUB_MAXIN)return toast('사진이 너무 커요(80MB 넘음). 다른 사진을 골라 주세요')}
 await lock(b,async()=>{try{toast('제출하는 중이에요…');const id=FB.id(),base={c:CK,u:uid(),s:pr.s,n:pr.n,t,link,ts:Date.now()},prog=(i,n)=>toast(`제출하는 중이에요 (${i}/${n})`);
  if(f){if(isPdf(f)){base.pdf=1;base.nk=await putBig('subd/'+id,await readURL(f),{c:CK,u:uid()},prog)}else{const data=await fitImg(f);base.th=await shrink(f,240,.7);base.nk=await putBig('subd/'+id,data,{c:CK,u:uid()})}}
  await FB.set('sub/'+id,base);clr('sbt','sbl');const fi=G('sbf');if(fi)fi.value='';toast('과제를 제출했어요')}catch(e){console.warn(e);toast(e&&e.message=='too big'?'사진을 충분히 줄이지 못했어요. 다른 사진으로 해 주세요':e&&e.type=='error'?'이 사진 형식은 열 수 없어요. 휴대폰 카메라 사진(JPG)으로 다시 골라 주세요':'제출하지 못했어요'+(e&&e.code?' ('+e.code+')':''))}})}
async function openSub(id){const x=S.subs.find(y=>y.id==id),M=G('modal');if(!x)return;if(x.pdf){const w=window.open('','_blank');try{toast('여는 중이에요…');const u=URL.createObjectURL(await (await fetch(await getBig('subd/'+id))).blob());if(w)w.location=u;else location.href=u}catch(e){if(w)w.close();toast('PDF를 열지 못했어요')}return}M.innerHTML=`<div class=modal onclick="G('modal').innerHTML=''"><div class=card style="text-align:center"><p>불러오는 중…</p></div></div>`;
 try{const d={data:await getBig('subd/'+id)};M.innerHTML=`<div class=modal onclick="G('modal').innerHTML=''"><div class=card style="text-align:center;max-width:900px;padding:8px"><img src="${safeImg(d.data)}" style="max-width:100%;max-height:75vh;border-radius:10px" alt=""><p>${S.admin?esc(x.s+' '+x.n)+' · ':''}${esc(x.t||'')} <small style="display:inline">${md(x.ts)}</small></p><a class="btn sm" href="${safeImg(d.data)}" download="과제_${esc(x.s)}_${id}.jpg" onclick="event.stopPropagation()">⬇️ 내려받기</a> <button class="btn ghost sm">닫기</button></div></div>`}catch(e){M.innerHTML='';toast('사진을 불러오지 못했어요')}}
function delSub(id){const x=S.subs.find(y=>y.id==id);if(!x)return;FB.batch([['del','sub/'+id],...(x.th||x.pdf?delBig('subd/'+id,x.nk):[])]).then(()=>toast(S.admin?'삭제했어요':'제출을 취소했어요'),fail('지우지 못했어요'))}

const ATC=['질병','미인정','기타','인정'];

const GYD={th:[5,10,15,20,25,30,35,40,45,50,55,60],conv:5,inc:[1],warn:2,ddk:['복장','전자기기 사용','기타 불손 행위'],ddn:3};

function gyAtt(s){const g=gy(),A=attOf(s),sum=k=>g.inc.reduce((a,j)=>a+(A[k][j]||0),0),ab=sum('결석'),etc=sum('지각')+sum('조퇴')+sum('결과'),conv=ab+Math.floor(etc/g.conv),hit=g.th.filter(n=>conv>=n),next=g.th.find(n=>n>conv);
 return {ab,etc,conv,hit,next,left:next==null?null:next-conv,rest:g.conv-etc%g.conv,lv:hit.length&&conv==hit[hit.length-1]?3:next!=null&&next-conv<=g.warn?2:hit.length?1:0}}

  :a.lv==2?`⚠️ <b>생교위 조심</b> — 환산 결석 ${a.conv}일. 앞으로 ${a.left}일 더 결석하면 생교위에 회부돼요 (기준 ${a.next}일).`

  :`${d.tot?'📌':'✅'} 디딤돌 ${d.tot}장 · ${g.ddn}장이 되면 생교위에 회부돼요 (${d.left}장 남음)`;

 <h4 style="margin-top:12px">🪨 디딤돌</h4>${gyBadge(d.lv,dt)}${g.ddk.map(k=>`<div class=row><span>${esc(k)}</span><span>${t?`<button class="btn ghost sm" onclick="ddAdd('${esc(s)}',this.dataset.k,-1)" data-k="${esc(k)}">−</button> `:''}<b>${+dd[k]||0}장</b>${t?` <button class="btn sm" onclick="ddAdd('${esc(s)}',this.dataset.k,1)" data-k="${esc(k)}">＋</button>`:''}</span></div>`).join('')}
 ${log.length?`<details><summary><small style="display:inline">받은 날짜 보기 (${log.length})</small></summary>${log.slice().reverse().map(x=>`<div class=row><small>${md(x.ts)} · ${esc(x.k)}</small></div>`).join('')}</details>`:''}</div>`}
function ddAdd(s,k,n){const dd={...ddOf(s)},log=ddLog(s).slice(),cur=+dd[k]||0;if(n<0&&!cur)return;dd[k]=cur+n;if(n>0)log.push({k,ts:Date.now()});else{const i=log.map(x=>x.k).lastIndexOf(k);if(i>=0)log.splice(i,1)}
 return FB.set('stu/'+s,{dd,ddl:log},true).then(()=>{const d=gyDd(s);toast(n>0?(d.lv==3?`디딤돌 ${d.tot}장 · 생교위 회부 기준이에요`:'디딤돌을 기록했어요'):'디딤돌 하나를 지웠어요')},fail('저장하지 못했어요'))}

const lib=k=>new Promise((ok,no)=>{const [u,g]=LIBS[k];if(g())return ok(g());const s=document.createElement('script');s.src=u;s.onload=()=>ok(g());s.onerror=()=>no(new Error('lib'));document.head.appendChild(s)});
const DROPCOL=/이름|성명|연락처|전화|휴대|핸드폰|주소|생년|주민|이메일|메일/;
async function readF(f){const n=f.name.toLowerCase();
 if(/\.(xlsx|xls|csv)$/.test(n)){const X=await lib('x'),wb=X.read(await f.arrayBuffer());return wb.SheetNames.map(s=>{const R=X.utils.sheet_to_json(wb.Sheets[s],{header:1,defval:''}).filter(r=>r.some(c=>c!=='')),h=(R[0]||[]).map(String);return R.slice(1).map(r=>h.map((x,i)=>r[i]===''||r[i]==null||DROPCOL.test(x)?'':`${x}:${r[i]}`).filter(Boolean).join(' | ')).join('\n')}).join('\n')}
 if(/\.pdf$/.test(n)){const L=await lib('p');L.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await L.getDocument({data:await f.arrayBuffer()}).promise;let o='';for(let i=1;i<=Math.min(d.numPages,60);i++){const c=await(await d.getPage(i)).getTextContent();o+=c.items.map(x=>x.str).join(' ')+'\n'}return o}

function anon(t){const known=new Set(roster().map(r=>r.s)),fwd={},rev={};let i=0;

 await lock(b,()=>FB.set('config/main',{gy:g},true).then(()=>toast('생교위 조건을 저장했어요'),fail('저장하지 못했어요')))}

 <p class=pw style="margin:6px 0">지우는 것: 학생·학부모 계정과 명렬표, 공지·알림 글, 메시지, 서류·설문·상담 기록, 출결·디딤돌, 기초자료·상담 정리, 자료·사진·과제·선물 (담임반과 모든 수업반)\n남기는 것: 선생님 계정${''}, 학교 설정(연락처·반 나누기·생교위 조건), 디딤돌 안내 문장 모음</p>

import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import{initializeFirestore,getFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,collection,collectionGroup,query,where,onSnapshot,writeBatch}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

// ===== 설정 (이 부분만 고치면 됩니다) =====
// 파이어베이스 콘솔 → 프로젝트 설정 → 내 앱 에 나오는 firebaseConfig 값 6개
const firebaseConfig = {
  apiKey: "AIzaSyBBqBI1Fg-oOD7armN5BrkaO-Mq8n-L-eg",
  authDomain: "class-noticeboard-4b9f3.firebaseapp.com",
  projectId: "class-noticeboard-4b9f3",
  storageBucket: "class-noticeboard-4b9f3.firebasestorage.app",
  messagingSenderId: "266297279593",
  appId: "1:266297279593:web:2f657530d3b9fc32ba4ef8"
};
// ==========================================

const ready=!/^여기에/.test(firebaseConfig.apiKey);
if(!ready){window.FB={ready:false}}else{
const fbApp=initializeApp(firebaseConfig),auth=getAuth(fbApp);
let db;try{db=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(fbApp)}
const D=p=>doc(db,...p.split('/')),list=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const Q=(p,o)=>{const c=p[0]=='*'?collectionGroup(db,p.slice(1)):collection(db,...p.split('/'));return o&&o.where?query(c,where(...o.where)):c};
const prov=()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return p};
window.FB={ready:true,
 onAuth:cb=>onAuthStateChanged(auth,u=>cb(u&&{uid:u.uid,email:(u.email||'').toLowerCase(),rawEmail:u.email||''})),
 async login(){try{await signInWithPopup(auth,prov())}catch(e){if(/popup-blocked|operation-not-supported/.test(e.code||''))return signInWithRedirect(auth,prov());throw e}},
 redirect:()=>getRedirectResult(auth),
 logout:()=>signOut(auth),
 token:()=>auth.currentUser?auth.currentUser.getIdToken():Promise.resolve(''),
 get:async p=>{const s=await getDoc(D(p));return s.exists()?s.data():null},
 set:(p,d,m)=>setDoc(D(p),d,m?{merge:true}:{}),
 add:async(p,d)=>(await addDoc(collection(db,...p.split('/')),d)).id,
 upd:(p,d)=>updateDoc(D(p),d),
 del:p=>deleteDoc(D(p)),
 // ops: ['set',경로,자료,합치기] / ['set',경로,{필드:값},false,'field'] (그 필드만 통째로 바꿈) / ['upd',경로,자료] / ['del',경로]
 batch:async ops=>{const b=writeBatch(db);ops.forEach(([k,p,d,m,f])=>k=='del'?b.delete(D(p)):k=='upd'?b.update(D(p),d):f=='field'?b.set(D(p),d,{mergeFields:Object.keys(d)}):b.set(D(p),d,m?{merge:true}:{}));await b.commit()},
 wDoc:(p,cb,er)=>onSnapshot(D(p),s=>cb(s.exists()?s.data():null),er),
 wCol:(p,o,cb,er)=>onSnapshot(Q(p,o),s=>cb(list(s)),er),
 list:async p=>(await getDocs(Q(p,{}))).docs.map(d=>d.ref.path),
 id:()=>doc(collection(db,'_')).id};
}
window.dispatchEvent(new Event('fb'));
/*FB-END*/
</script>
</body></html>
