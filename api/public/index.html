<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재이미나는 학급의 스마트한 알림장</title>
<style>
:root{--ink:#3b2a1a;--sub:#7a6450;--card:#fffaf0;--line:#ecd9b0;--veil:rgba(255,243,210,.86);--wood:#a8672f;--acc:#f2a33a;padding-top:env(safe-area-inset-top,0)}
@media(prefers-color-scheme:dark){:root{--ink:#f7ecd8;--sub:#cdb89a;--card:#2c2217;--line:#4a3a26;--veil:rgba(28,20,11,.9)}}
*{box-sizing:border-box}body{margin:0;background:#fde9b8;color:var(--ink);font:15px/1.55 'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--veil),var(--veil)),url(bg.jpg) center/cover}
#hd{position:sticky;top:0;z-index:5;background:var(--wood);color:#fff6df;padding:8px 12px;display:flex;gap:8px;align-items:center}#hd b{flex:1;font-size:17px}
button,input,textarea,select{font:inherit}.hero{aspect-ratio:1408/768;max-width:760px;margin:0 auto;background:url(bg.jpg) center/cover;border-radius:0 0 26px 26px;border-bottom:6px solid var(--wood)}
.w{max-width:760px;margin:0 auto;padding:6px 14px 96px}.c{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}h2,h3{margin:0 0 6px}.s{color:var(--sub);font-size:13px}
.b{background:var(--acc);border:2px solid var(--wood);border-radius:14px;padding:9px 14px;color:#3b2a1a;box-shadow:0 3px 0 var(--wood);cursor:pointer;width:100%;margin:6px 0}.b.g{background:var(--card);color:var(--ink);width:auto;padding:4px 10px;box-shadow:none}
#hd .g{background:none;color:inherit;border:1px solid #fff6df88;border-radius:99px;padding:3px 10px;cursor:pointer}
input,textarea,select{width:100%;margin:5px 0;padding:10px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;font-size:16px}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.ch button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px}.ch .on{background:var(--acc);border-color:var(--wood);color:#3b2a1a}
.r{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}
.m{max-width:82%;background:var(--line);padding:8px 12px;border-radius:14px 14px 14px 4px;margin:6px 0}.m.me{margin-left:auto;background:var(--acc);color:#3b2a1a;border-radius:14px 14px 4px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px}.two summary{cursor:pointer;font-weight:700}
.new{display:block;width:100%;text-align:left;border:2px dashed var(--wood);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;margin:10px 0}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:var(--wood);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0))}
#nav button{flex:1;position:relative;background:#fff6df26;border:0;color:#fff6df;border-radius:12px;padding:5px 0;font-size:13px}#nav b{position:absolute;top:-5px;right:6px;background:#d2493c;border-radius:99px;font-size:11px;padding:0 6px}
#t{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#3b2a1a;color:#fff6df;padding:8px 16px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none}#t.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.two{grid-template-columns:1fr}}
</style></head><body>
<header id="hd"></header><main id="app"></main><nav id="nav"></nav><div id="t"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,orderBy,onSnapshot,updateDoc,deleteDoc,writeBatch}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),mask=n=>n.length<3?n[0]+'0':n.slice(0,-2)+'0'+n.slice(-1),dt=t=>{const d=new Date(t);return(d.getMonth()+1)+'/'+d.getDate()};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),D=p=>doc(db,...p.split('/')),C=p=>collection(db,p);
const FS=[['sch','학교명'],['yr','학년도'],['gr','학년'],['cl','반'],['dom','학생 구글 계정 도메인 (예: school.hs.kr)'],['tn','담임 이름'],['tel1','교무실 직통전화'],['tel2','행정실 전화'],['tel3','담임 핸드폰 안심번호']],FT=[['motto','급훈'],['intro','인사말'],['us','이것만은 기억하고 지켜줘요 · 학생용'],['up','이것만은 기억하고 지켜줘요 · 학부모용'],['note','전화 시 유의사항']];
const REL=['어머니','아버지','조부모','기타 보호자'];
let S={tab:'home',role:'student',cfg:{},posts:[],msgs:[],reads:{},users:[],open:null,RA:''},un=[],done=new Set();
const toast=m=>{const t=$('#t');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)};
onAuthStateChanged(auth,async u=>{un.forEach(f=>f());un=[];S.u=u;S.prof=null;S.admin=false;if(!u)return draw();
 try{const[a,p,c]=await Promise.all([getDoc(D('admins/'+u.uid)),getDoc(D('users/'+u.uid)),getDoc(D('config/main'))]);S.admin=a.exists();S.prof=p.exists()?p.data():null;S.cfg=c.data()||{};if(S.admin||S.prof)listen()}catch(e){toast('데이터를 불러오지 못했어요. 규칙·설정을 확인해 주세요.')}draw()});
function listen(){const u=S.u.uid;un.push(onSnapshot(D('config/main'),d=>{S.cfg=d.data()||{};draw()}));
un.push(onSnapshot(query(C('posts'),orderBy('ts','desc')),s=>{S.posts=s.docs.map(d=>({id:d.id,...d.data()}));draw()}));
un.push(onSnapshot(S.admin?C('messages'):query(C('messages'),where('owner','==',u)),s=>{S.msgs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);draw()}));
un.push(onSnapshot(D('reads/'+u),d=>{S.reads=d.data()||{};draw()}));
if(S.admin)un.push(onSnapshot(C('users'),s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));draw()}))}
const unread=()=>S.msgs.filter(m=>!m.r&&(S.admin?m.from=='u':m.from=='t')).length,newPosts=()=>S.posts.filter(p=>!S.reads[p.id]).length;
function markRead(){if(S.tab!='msg'||(S.admin&&!S.open))return;S.msgs.filter(m=>!m.r&&!done.has(m.id)&&(S.admin?m.from=='u'&&m.owner==S.open:m.from=='t')).forEach(m=>{done.add(m.id);updateDoc(D('messages/'+m.id),{r:true,rt:Date.now()}).catch(()=>{})})}
const who=id=>{const x=S.users.find(u=>u.id==id);return x?`${x.s} ${x.n}${x.r=='parent'?' 학부모'+(x.rel?'('+x.rel+')':''):''}`:'(알 수 없음)'};
const chips=(a,on,fn)=>`<div class=ch>${a.map(([k,l])=>`<button class="${on(k)?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
function draw(){const a=$('#app'),hd=$('#hd'),nv=$('#nav'),hero='<div class=hero></div>';
if(!S.u){hd.innerHTML='<b>스마트 알림장</b>';nv.innerHTML='';a.innerHTML=hero+`<div class=w><div class=c><h2>👋 시작하기</h2><p class=s>학생은 학교 구글 계정으로 접속해 주세요. 처음 사용한 구글 계정으로만 접속할 수 있어요.</p><button class=b onclick="login()">Google 계정으로 계속하기</button></div></div>`;return}
hd.innerHTML=`<b>${esc(S.cfg.sch||'스마트 알림장')}</b><span class=s style="color:inherit">${esc(S.admin?(S.cfg.tn||'교사')+' · 교사':S.prof?S.prof.n+' · '+(S.prof.r=='parent'?'학부모':'학생'):'')}</span><button class=g onclick="logout()">로그아웃</button>`;
if(!S.admin&&!S.prof){nv.innerHTML='';const p=S.role=='parent';a.innerHTML=hero+`<div class=w><div class=c><h3>${p?'👪 자녀 정보 입력':'🎒 학번·이름 입력'}</h3><p class=s>${esc(S.u.email)} 계정으로 처음 가입해요. 한 번만 입력하면 돼요. 이름은 가운데 글자를 0으로 가린 상태로 저장돼요.</p>${chips([['student','학생'],['parent','학부모']],k=>k==S.role,'setR')}<input id=s inputmode=numeric placeholder="${p?'학생 학번':'학번'} (예: 30101)"><input id=n placeholder="${p?'학생 이름':'이름'}">${p?`<select id=rel><option value="">학생과의 관계</option>${REL.map(x=>`<option>${x}</option>`).join('')}</select>`:''}<button class=b onclick="reg()">가입하고 시작하기</button><p class=s>🎒 학생은 학교 구글 계정으로 접속해 주세요.</p></div></div>`;return}
const T=S.admin?[['home','🏠','홈'],['notice','📌','알림장'],['msg','✉️','메시지'],['people','🗂️','학생'],['set','⚙️','설정']]:[['home','🏠','홈'],['notice','📌','알림장'],['msg','✉️','메시지']],nb={notice:S.admin?0:newPosts(),msg:unread()};
nv.innerHTML=T.map(([k,i,l])=>`<button onclick="tab('${k}')">${i}<br>${l}${nb[k]?`<b>${nb[k]}</b>`:''}</button>`).join('');
a.innerHTML=(S.tab=='home'?hero:'')+`<div class=w>${V[S.tab]()}</div>`;markRead()}
const V={
home(){const c=S.cfg,p=S.prof&&S.prof.r=='parent';return `<div class=c><h3>${S.admin?esc(c.tn||'선생님')+' 선생님':esc(S.prof.n)+(p?' 학부모님':' 학생')}</h3><p class=s>${esc(c.sch||'학교명 미설정')} ${esc(c.gr)}학년 ${esc(c.cl)}반 · ${esc(c.yr)}학년도</p>${c.motto?`<p>🌱 ${esc(c.motto)}</p>`:''}<p>${esc(c.intro)}</p></div><div class=two><details><summary>📖 이것만은 기억하고 지켜줘요</summary><p style="white-space:pre-wrap">${esc(p?c.up:c.us)||'선생님이 아직 입력하지 않았어요.'}</p></details><details><summary>📞 연락처</summary>${[['교무실 직통','tel1'],['행정실','tel2'],['담임 안심번호','tel3']].map(([l,k])=>`<div class=r><span class=s>${l}</span>${c[k]?`<a href="tel:${esc(String(c[k]).replace(/[^\d+]/g,''))}">${esc(c[k])}</a>`:'<span class=s>등록 전</span>'}</div>`).join('')}<p class=s style="white-space:pre-wrap">📌 ${esc(c.note)}</p></details></div>`},
notice(){const f=S.admin?`<div class=c><h3>📌 알림 글 올리기</h3><input id=pt placeholder="제목"><textarea id=pb rows=4 placeholder="내용"></textarea><button class=b onclick="post()">올리기</button></div>`:'';
return f+(S.posts.map(p=>S.admin?`<div class=c><span class=s>${dt(p.ts)}</span><h3>${esc(p.t)}</h3><p style="white-space:pre-wrap">${esc(p.b)}</p><button class="b g" onclick="delPost('${p.id}')">삭제</button></div>`:S.reads[p.id]?`<div class=c><span class=s>${dt(p.ts)}</span><h3>${esc(p.t)}</h3><p style="white-space:pre-wrap">${esc(p.b)}</p></div>`:`<button class=new onclick="readPost('${p.id}')">🆕 ${esc(p.t)} <span class=s>눌러서 확인</span></button>`).join('')||'<div class=c>아직 글이 없어요</div>')},
msg(){if(S.admin&&!S.open){const g={};S.msgs.forEach(m=>{(g[m.owner]=g[m.owner]||{o:m.owner,u:0,l:m}).l=m;if(m.from=='u'&&!m.r)g[m.owner].u++});return `<div class=c><h3>✉️ 메시지</h3>${Object.values(g).map(x=>`<div class=r><button class="b g" style="width:100%;text-align:left" onclick="openT('${x.o}')">${esc(who(x.o))}${x.u?` <b style="color:#d2493c">새 글 ${x.u}</b>`:''}<br><span class=s>${esc(x.l.x.slice(0,30))}</span></button></div>`).join('')||'<p class=s>받은 메시지가 없어요</p>'}</div>`}
const o=S.admin?S.open:S.u.uid,L=S.msgs.filter(m=>m.owner==o);return `<div class=c>${S.admin?`<button class="b g" onclick="openT(null)">‹ 목록</button><h3>${esc(who(o))}</h3>`:'<h3>✉️ 선생님과의 메시지</h3>'}${L.map(m=>{const mine=S.admin?m.from=='t':m.from=='u';return `<div class="m ${mine?'me':''}"><span class=s>${dt(m.ts)}</span><br>${esc(m.x)}${mine?`<br><span class=s>${m.r?'✓ 읽음':'● 안 읽음'}</span>`:''}</div>`}).join('')||'<p class=s>아직 없어요</p>'}<textarea id=mx rows=3 placeholder="메시지 쓰기"></textarea><button class=b onclick="send('${o}')">보내기</button></div>`},
people(){const row=u=>S.EA==u.id?`<div class=c style="margin:6px 0"><span class=s>학번</span><input id=ea_s value="${esc(u.s)}" inputmode=numeric><span class=s>이름 (가운데 글자는 0으로 가려 저장돼요)</span><input id=ea_n value="${esc(u.n)}">${u.r=='parent'?`<select id=ea_l>${REL.map(x=>`<option ${u.rel==x?'selected':''}>${x}</option>`).join('')}</select>`:''}<span class=s style="word-break:break-all">구글 계정: ${esc(u.email)} (계정을 바꾸려면 초기화 후 새 계정으로 다시 가입)</span><div class=r><button class="b g" onclick="saveU('${u.id}')">저장</button><button class="b g" onclick="editU('')">취소</button></div></div>`:`<div class=r><span>${esc(u.s)} ${esc(u.n)} · ${u.r=='parent'?'학부모'+(u.rel?'('+esc(u.rel)+')':''):'학생'}<br><span class=s style="word-break:break-all">${esc(u.email)} · ${dt(u.at)}</span></span><span><button class="b g" onclick="editU('${u.id}')">수정</button> <button class="b g" onclick="resetU('${u.id}','${u.r=='student'?esc(u.s):''}')">${S.RA==u.id?'한 번 더 눌러 초기화':'초기화'}</button></span></div>`;
return `<div class=c><h3>📧 최초 구글 계정·학번·이름 관리</h3><p class=s>가입할 때 처음 입력한 계정이에요. 학번·이름·관계는 고칠 수 있고, 구글 계정을 바꾸려면 초기화하면 새 계정으로 다시 가입할 수 있어요.</p>${S.users.sort((a,b)=>a.s>b.s?1:-1).map(row).join('')||'<p class=s>가입한 사람이 없어요</p>'}</div>`},
set(){return `<div class=c><h3>⚙️ 초기·연간 설정</h3><p class=s>학년이 바뀌면 새로 입력하세요.</p>${FS.map(([k,l])=>`<span class=s>${l}</span><input id=f_${k} value="${esc(S.cfg[k])}">`).join('')}${FT.map(([k,l])=>`<span class=s>${l}</span><textarea id=f_${k} rows=3>${esc(S.cfg[k])}</textarea>`).join('')}<button class=b onclick="saveCfg()">설정 저장</button></div>`}};
const A={
login:()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>toast('로그인하지 못했어요: '+(e.code||e.message))),
logout:()=>signOut(auth),editU:id=>{S.EA=id;draw()},tab:k=>{S.tab=k;if(k!='msg')S.open=null;draw();scrollTo(0,0)},setR:k=>{S.role=k;draw()},openT:o=>{S.open=o;draw()},
async reg(){const p=S.role=='parent',s=$('#s').value.trim(),n0=$('#n').value.trim(),rel=p?$('#rel').value:'';if(!/^\d{4,6}$/.test(s))return toast(p?'학생 학번을 숫자로 입력해 주세요':'학번을 숫자로 입력해 주세요');if(n0.length<2)return toast('이름을 입력해 주세요');if(p&&!rel)return toast('학생과의 관계를 골라 주세요');
 const u=S.u,b=writeBatch(db),prof={email:u.email,n:mask(n0),s,r:S.role,rel,at:Date.now()};if(!p)b.set(D('studentIds/'+s),{uid:u.uid});b.set(D('users/'+u.uid),prof);
 try{await b.commit();S.prof=prof;listen();draw()}catch(e){toast(p?'가입하지 못했어요. 잠시 후 다시 시도해 주세요':'가입하지 못했어요. 학교 구글 계정인지, 이미 등록된 학번인지 확인해 주세요')}},
async send(o){const x=$('#mx').value.trim();if(!x)return;try{await addDoc(C('messages'),{owner:o,from:S.admin?'t':'u',n:S.admin?(S.cfg.tn||'교사'):S.prof.n,x,ts:Date.now(),r:false})}catch(e){toast('보내지 못했어요')}},
async post(){const t=$('#pt').value.trim();if(!t)return toast('제목을 적어 주세요');await addDoc(C('posts'),{t,b:$('#pb').value.trim(),ts:Date.now()});toast('올렸어요')},
delPost:id=>deleteDoc(D('posts/'+id)),readPost:id=>setDoc(D('reads/'+S.u.uid),{[id]:true},{merge:true}),
async saveCfg(){const v={};[...FS,...FT].forEach(([k])=>v[k]=$('#f_'+k).value.trim());v.dom=v.dom.replace(/^@/,'');try{await setDoc(D('config/main'),v,{merge:true});toast('저장했어요')}catch(e){toast('저장하지 못했어요')}},
async saveU(id){const u=S.users.find(x=>x.id==id),s=$('#ea_s').value.trim(),n0=$('#ea_n').value.trim(),rel=u.r=='parent'?$('#ea_l').value:'';if(!/^\d{4,6}$/.test(s))return toast('학번을 숫자로 입력해 주세요');if(n0.length<2)return toast('이름을 2글자 이상 입력해 주세요');const b=writeBatch(db);b.update(D('users/'+id),{n:mask(n0),s,rel});if(u.r=='student'&&s!=u.s){b.delete(D('studentIds/'+u.s));b.set(D('studentIds/'+s),{uid:id})}try{await b.commit();S.EA='';toast('저장했어요')}catch(e){toast('저장하지 못했어요. 이미 등록된 학번인지 확인해 주세요')}},
async resetU(id,s){if(S.RA!=id){S.RA=id;draw();return toast('한 번 더 누르면 초기화돼요')}const b=writeBatch(db);b.delete(D('users/'+id));if(s)b.delete(D('studentIds/'+s));await b.commit();S.RA='';toast('초기화했어요')}};
Object.assign(window,A);
</script></body></html>
